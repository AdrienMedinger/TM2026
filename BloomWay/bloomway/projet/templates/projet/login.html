{% extends 'projet/base.html' %}
{% block content %}

<style>
    .formulaire input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 4px;
    }
    .formulaire label { font-weight: bold; }
</style>

<div class="w3-content w3-padding-64" style="max-width:420px;">
    <div class="w3-card-4 w3-white w3-round-large">

        <header class="w3-container w3-black w3-center w3-round-large">
            <h2 style="font-family:'Playfair Display', serif;">Connexion</h2>
        </header>

        <div class="w3-container w3-padding-24">

            {% if message %}
                <div class="w3-panel w3-pale-red w3-border w3-border-red w3-round">
                    <p>{{ message }}</p>
                </div>
            {% endif %}

            <form method="post" class="formulaire">
                {% csrf_token %}
                {% for field in form %}
                    <p>
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                            <span class="w3-text-red w3-small">{{ error }}</span>
                        {% endfor %}
                    </p>
                {% endfor %}

                <button type="submit" class="w3-button w3-black w3-block w3-round w3-margin-top">Se connecter</button>
            </form>

            <p class="w3-center w3-margin-top">
                Pas encore de compte ? <a href="{% url 'signup' %}" class="w3-text-blue">Inscrivez-vous ici</a>
            </p>
        </div>

    </div>
</div>

{% endblock %}
