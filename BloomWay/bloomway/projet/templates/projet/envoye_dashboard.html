{% extends 'projet/base.html' %}


{% block content %}

<!-- header -->


        <div class="container">
            <div class="row">
                <center>
                    <div class="col-8">
                        <br></br>

    


                    </div>
                </center>
            </div>
        </div>
<h3>Item Envoyé</h3>

<div class ="table table-striped">
    <table>
            <tr>
                <th>Commande</th>
                <th>Prix</th>
                <th>Email du client</th>
                <th>date d'envoie</th>
                
            </tr>
            {% for item in orders %}
            <tr>
                <td><a href="{% url 'commande' item.id %}">{{ item.id }}</a></td>
                <td>{{ item.montant_payé }} Fr </td>
                <td>{{ item.email }}</td>
                <td>{{ item.date_envoie }}</td>
                <td>
                    <form method="post" action="{% url 'envoye_dashboard' %}">
                        {% csrf_token %}
                        <input type="hidden" name="order_id" value="{{ item.id }}">
                        <button type="submit">Marquer comme non envoyé</button>
                    </form>
                </td>
                
            {% endfor %}
                
            </tr>
   
    </table>
    <style>
        th, td{
            padding: 5px 30px;

        }
    </style>
</div>






{% endblock %}
