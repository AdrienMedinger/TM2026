<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- pétale extérieur en bulbe : fin à la base, large en haut, pointe courte -->
    <path id="ext" d="M50 50 C 44 44, 36 32, 37 24 C 38 19, 43 17, 46 14 C 48.5 12, 49.6 9, 50 5 C 50.4 9, 51.5 12, 54 14 C 57 17, 62 19, 63 24 C 64 32, 56 44, 50 50 Z"/>
    <!-- pétale intérieur, même forme en plus petit -->
    <path id="int" d="M50 50 C 45 46, 40 39, 41 33 C 42 29, 45 28, 47.5 26.5 C 49 25.5, 49.7 24, 50 21 C 50.3 24, 51 25.5, 52.5 26.5 C 55 28, 58 29, 59 33 C 60 39, 55 46, 50 50 Z"/>
    <g id="etoile">
      <use href="#int"/>
      <use href="#int" transform="rotate(72 50 50)"/>
      <use href="#int" transform="rotate(144 50 50)"/>
      <use href="#int" transform="rotate(216 50 50)"/>
      <use href="#int" transform="rotate(288 50 50)"/>
    </g>
  </defs>

  <!-- 10 pétales extérieurs qui se chevauchent -->
  <g fill="#ffffff" stroke="#8B1E2D" stroke-width="1.8" stroke-linejoin="round">
    <!-- 5 pétales du fond -->
    <use href="#ext" transform="rotate(0 50 50) translate(50 50) scale(1.07) translate(-50 -50)"/>
    <use href="#ext" transform="rotate(72 50 50) translate(50 50) scale(1.07) translate(-50 -50)"/>
    <use href="#ext" transform="rotate(144 50 50) translate(50 50) scale(1.07) translate(-50 -50)"/>
    <use href="#ext" transform="rotate(216 50 50) translate(50 50) scale(1.07) translate(-50 -50)"/>
    <use href="#ext" transform="rotate(288 50 50) translate(50 50) scale(1.07) translate(-50 -50)"/>
    <!-- 5 pétales devant -->
    <use href="#ext" transform="rotate(36 50 50) translate(50 50) scale(0.88) translate(-50 -50)"/>
    <use href="#ext" transform="rotate(108 50 50) translate(50 50) scale(0.88) translate(-50 -50)"/>
    <use href="#ext" transform="rotate(180 50 50) translate(50 50) scale(0.88) translate(-50 -50)"/>
    <use href="#ext" transform="rotate(252 50 50) translate(50 50) scale(0.88) translate(-50 -50)"/>
    <use href="#ext" transform="rotate(324 50 50) translate(50 50) scale(0.88) translate(-50 -50)"/>
  </g>

  <!-- étoile intérieure à 5 pétales : on ne garde que son contour -->
  <use href="#etoile" fill="none" stroke="#8B1E2D" stroke-width="3.6" stroke-linejoin="round"/>
  <use href="#etoile" fill="#ffffff"/>

  <!-- la lettre B -->
  <text x="50" y="55.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#8B1E2D" stroke="#8B1E2D" stroke-width="0.3">B</text>
</svg>
